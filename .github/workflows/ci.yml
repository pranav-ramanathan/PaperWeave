name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Tests that need Docker: the TeX image, Postgres and the object store.
  sandbox-and-browser:
    runs-on: ubuntu-latest
    # Took about 35 minutes with the browser tests one at a time (27.5 of them measured on a
    # fast machine, 15.6 with two at a time, 11.5 with three). Two run now: with three, the one
    # build worker's queue made a test wait too long for a build. building.spec.ts alone is about
    # 7 minutes, so it bounds what more workers could save.
    # 60 leaves room for a slow runner. A run that hangs is still stopped here rather than
    # after the six hours GitHub allows.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pdftotext, pdfinfo and pdffonts: the sandbox tests read what a built PDF says.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm test:sandbox
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_WORKERS: 2
      # What each failed browser test's page looked like, kept for a week. The log alone says
      # which line failed, not what was on the screen.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The same browser tests with the new look chosen: every person starts with the cookie
  # `pw_ui=next` (E2E_UI, tests/e2e/helpers.ts). A page not yet moved to the new look ignores it,
  # so this is "new where moved, old everywhere else". It is a job of its own, not a second step
  # of the one above, so that it runs beside it on its own runner (no wall-clock added: the
  # slower of the two decides) and so that the name of `sandbox-and-browser` stays what branch
  # protection knows it as. It is not a required check: it is told apart by name, and the owner
  # decides when it becomes one. The unit tests, lint and the sandbox tests do not depend on the
  # look and are not run again.
  browser-next:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # (No poppler: only the sandbox tests read PDFs with it.)
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_WORKERS: 2
          E2E_UI: next
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-next-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # A view of progress, not a check: the whole suite with the new look chosen AND the pages that
  # are still being built in it shown (UI_STAGED=1: the editor, until it is moved, T18 to T27).
  # `continue-on-error`, so a red run here never turns the workflow red; it is not a required
  # check and must not become one. The last task for the editor (T27) moves it to the finished
  # pages and removes this job.
  browser-staged:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_WORKERS: 2
          E2E_UI: next
          UI_STAGED: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-staged-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
