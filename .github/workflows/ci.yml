name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Tests that need Docker: the TeX image, Postgres and the object store.
  sandbox-and-browser:
    runs-on: ubuntu-latest
    # Usually ten minutes, thirteen when the images are slow to fetch. A run that hangs is
    # stopped here rather than after the six hours GitHub allows.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm test:sandbox
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      # What each failed browser test's page looked like, kept for a week. The log alone says
      # which line failed, not what was on the screen.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
