name: CI
on:
  push:
    branches: [main]
  pull_request:

# Several PRs are updated in quick succession, and superseded runs held runners for nothing.
# A newer run for the same PR cancels the older one; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The sandbox, browser and sandbox-and-browser jobs together are what one job used to be:
  # about 23 minutes in a row (TeX image 3.4, compose 0.5, sandbox tests 5.0, browser tests 13.5
  # with the build). The first two now run side by side, and the last one only reports their
  # result under the name that branch protection requires.

  # Tests that need Docker: the TeX image, Postgres and the object store.
  sandbox:
    runs-on: ubuntu-latest
    # About 10 minutes: image 3.4, compose 0.5, tests 5.0, and the install.
    # 25 leaves room for a slow runner. A run that hangs is still stopped here rather than
    # after the six hours GitHub allows.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pdftotext, pdfinfo and pdffonts: the sandbox tests read what a built PDF says.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm test:sandbox

  # The browser tests, in three shards that run side
  # by side, each with its own containers.
  browser:
    runs-on: ubuntu-latest
    strategy:
      # A failure in one shard does not hide the other's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Took about 35 minutes with the browser tests one at a time (27.5 of them measured on a
    # fast machine, 15.6 with two at a time, 11.5 with three). Two workers per shard run now: with
    # three, the one build worker's queue made a test wait too long for a build. building.spec.ts
    # alone is about 7 minutes, so it bounds what more workers or shards could save. The files are
    # split by file, not by test, so one shard can end up with more of the long ones.
    # mail-down.spec.ts pauses the mail container, so its project depends on the e2e project and
    # runs after it. Sharding with that dependency kept the whole chain in one group: shard 1 ran
    # all 265 tests and the others ran none (it took about 18 minutes either way). So each shard
    # runs its share of the e2e project, and the last one then runs mail-down alone (--no-deps),
    # after its own share and against its own mail container. Split this way the shards hold
    # 100, 81 and 82 tests.
    # Each shard needs the TeX image too, so it pays for the image (3.4) and compose (0.5) again.
    # 45 leaves room for a slow runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project=e2e --shard=${{ matrix.shard }}/3
        env:
          E2E_WORKERS: 2
      - if: matrix.shard == 3
        run: pnpm e2e --project=mail-down --no-deps
      # Versions are on by default (T45), and the suite above runs that way. These three specs
      # also have tests for a server with VERSIONS=0 (that nothing of versions shows), which only
      # run against such a server. Shard 2 only: it is the lightest, and the three take about a
      # minute. (Until T52 the browser-classic job ran the whole suite with VERSIONS=0.)
      - if: matrix.shard == 2
        run: pnpm e2e --project=e2e tests/e2e/versions.spec.ts tests/e2e/merge.spec.ts tests/e2e/history-versions.spec.ts
        env:
          VERSIONS: 0
      # What each failed browser test's page looked like, kept for a week. The log alone says
      # which line failed, not what was on the screen.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The new look in dark: every person starts with the cookie
  # `pw_theme=dark` (E2E_THEME, tests/e2e/helpers.ts), so that `audit` (axe: contrast above all)
  # runs on each of them in dark. A small job, not the whole suite: the specs below are the ones
  # that open a page of the new look and audit it (the editor is not here: its dark theme is
  # not built yet). Not a required check.
  browser-dark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project=e2e tests/e2e/theme.spec.ts tests/e2e/a11y.spec.ts tests/e2e/projects.spec.ts tests/e2e/look.spec.ts tests/e2e/zoom.spec.ts tests/e2e/titles.spec.ts tests/e2e/history.spec.ts tests/e2e/charts.spec.ts tests/e2e/submit.spec.ts tests/e2e/revisions.spec.ts tests/e2e/paper-look.spec.ts tests/e2e/labels.spec.ts tests/e2e/data.spec.ts
        env:
          E2E_WORKERS: 2
          E2E_THEME: dark
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-dark-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The name branch protection requires. It runs whatever the other two did (a skipped or
  # cancelled job would otherwise leave this one skipped, which counts as passing) and fails
  # unless both succeeded.
  sandbox-and-browser:
    needs: [sandbox, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "sandbox: ${{ needs.sandbox.result }}, browser: ${{ needs.browser.result }}"
          test "${{ needs.sandbox.result }}" = success && test "${{ needs.browser.result }}" = success
