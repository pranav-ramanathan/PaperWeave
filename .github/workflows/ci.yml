name: CI
on:
  push:
    branches: [main]
  pull_request:

# Several PRs are updated in quick succession, and superseded runs held runners for nothing.
# A newer run for the same PR cancels the older one; pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # The sandbox, browser and sandbox-and-browser jobs together are what one job used to be:
  # about 23 minutes in a row (TeX image 3.4, compose 0.5, sandbox tests 5.0, browser tests 13.5
  # with the build). The first two now run side by side, and the last one only reports their
  # result under the name that branch protection requires.

  # Tests that need Docker: the TeX image, Postgres and the object store.
  sandbox:
    runs-on: ubuntu-latest
    # About 10 minutes: image 3.4, compose 0.5, tests 5.0, and the install.
    # 25 leaves room for a slow runner. A run that hangs is still stopped here rather than
    # after the six hours GitHub allows.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pdftotext, pdfinfo and pdffonts: the sandbox tests read what a built PDF says.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm test:sandbox

  # The browser tests, in three shards that run side by side, each with its own containers.
  browser:
    runs-on: ubuntu-latest
    strategy:
      # A failure in one shard does not hide the other's result.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Took about 35 minutes with the browser tests one at a time (27.5 of them measured on a
    # fast machine, 15.6 with two at a time, 11.5 with three). Two workers per shard run now: with
    # three, the one build worker's queue made a test wait too long for a build. building.spec.ts
    # alone is about 7 minutes, so it bounds what more workers or shards could save. The files are
    # split by file, not by test, so one shard can end up with more of the long ones.
    # mail-down.spec.ts pauses the mail container, so its project depends on the e2e project and
    # runs after it. Sharding with that dependency kept the whole chain in one group: shard 1 ran
    # all 265 tests and the others ran none (it took about 18 minutes either way). So each shard
    # runs its share of the e2e project, and the last one then runs mail-down alone (--no-deps),
    # after its own share and against its own mail container. Split this way the shards hold
    # 100, 81 and 82 tests.
    # Each shard needs the TeX image too, so it pays for the image (3.4) and compose (0.5) again.
    # 45 leaves room for a slow runner.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e --project=e2e --shard=${{ matrix.shard }}/3
        env:
          E2E_WORKERS: 2
      - if: matrix.shard == 3
        run: pnpm e2e --project=mail-down --no-deps
      # What each failed browser test's page looked like, kept for a week. The log alone says
      # which line failed, not what was on the screen.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The same browser tests with the new look chosen: every person starts with the cookie
  # `pw_ui=next` (E2E_UI, tests/e2e/helpers.ts). A page not yet moved to the new look ignores it,
  # so this is "new where moved, old everywhere else". It is a job of its own, not a second step
  # of the one above, so that it runs beside it on its own runner (no wall-clock added: the
  # slower of the two decides) and so that the name of `sandbox-and-browser` stays what branch
  # protection knows it as. It is not a required check: it is told apart by name, and the owner
  # decides when it becomes one. The unit tests, lint and the sandbox tests do not depend on the
  # look and are not run again.
  # Sharded like the job above, for the same reason and the same way.
  browser-next:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # (No poppler: only the sandbox tests read PDFs with it.)
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm exec playwright install --with-deps chromium
      # VERSIONS=1: this job runs the whole suite with versions turned on (versions.spec has the
      # tests that need it; the job above has the one that needs it off). The flag stays off by
      # default; turning it on for people is the owner's call (docs/settings.md).
      - run: pnpm e2e --project=e2e --shard=${{ matrix.shard }}/3
        env:
          E2E_WORKERS: 2
          E2E_UI: next
          VERSIONS: 1
      - if: matrix.shard == 3
        run: pnpm e2e --project=mail-down --no-deps
        env:
          E2E_UI: next
          VERSIONS: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-next-test-results-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  # The name branch protection requires. It runs whatever the other two did (a skipped or
  # cancelled job would otherwise leave this one skipped, which counts as passing) and fails
  # unless both succeeded.
  sandbox-and-browser:
    needs: [sandbox, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "sandbox: ${{ needs.sandbox.result }}, browser: ${{ needs.browser.result }}"
          test "${{ needs.sandbox.result }}" = success && test "${{ needs.browser.result }}" = success

  # A view of progress, not a check: the whole suite with the new look chosen AND the pages that
  # are still being built in it shown (UI_STAGED=1: the editor, until it is moved, T18 to T27).
  # `continue-on-error`, so a red run here never turns the workflow red; it is not a required
  # check and must not become one. The last task for the editor (T27) moves it to the finished
  # pages and removes this job.
  browser-staged:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build -t paperweave-tex infra/tex
      - run: docker compose -f infra/compose.yaml up -d --wait || (docker compose -f infra/compose.yaml logs --tail 60; exit 1)
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          E2E_WORKERS: 2
          E2E_UI: next
          UI_STAGED: 1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-staged-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
