# Local services for development and for the tests that need them: docker compose -f infra/compose.yaml up -d --wait
# The credentials are for local use only.
# Every published port is bound to 127.0.0.1 so that no one else on the network can reach these services.
services:
  postgres:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    environment:
      POSTGRES_USER: paperweave
      POSTGRES_PASSWORD: paperweave
      POSTGRES_DB: paperweave
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U paperweave']
      interval: 2s
      retries: 30

  # An S3-compatible object store. Production uses a real bucket through the same client.
  # Browsers put uploads in it and fetch large PDFs from it (docs/deploy.md), so it answers
  # cross-origin requests from the web app's addresses only (3000 is `next dev`, 3100 is `pnpm e2e`, 3200 to 3500 are its other test slots, README.md).
  s3:
    image: chrislusf/seaweedfs@sha256:4b42c212543a0acd4c0e675215ecdcaf62a186ef98def76c7e12701871222d15
    command: server -s3 -s3.allowedOrigins=http://localhost:3000,http://localhost:3100,http://localhost:3200,http://localhost:3300,http://localhost:3400,http://localhost:3500 -dir=/data
    ports: ['127.0.0.1:8333:8333']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1']
      interval: 2s
      retries: 30

  # Catches every email the app sends. Read them at http://localhost:8025.
  mail:
    image: axllent/mailpit@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

  # Spelling and grammar: LanguageTool, run here so that no text leaves for anyone else's
  # service. It takes a few seconds to start and about a gigabyte of memory.
  grammar:
    image: erikvl87/languagetool@sha256:ef8fa12cbd485166c9ceeb7139d76d56d07707a624da6bb1fc1fbb5411750527
    environment:
      Java_Xms: 256m
      Java_Xmx: 1g
    ports: ['127.0.0.1:8010:8010']
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8010/v2/languages || exit 1']
      interval: 3s
      retries: 40
